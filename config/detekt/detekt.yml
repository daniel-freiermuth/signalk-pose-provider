# Overrides on top of detekt's default config (`buildUponDefaultConfig = true` in
# app/build.gradle.kts). Everything not listed here keeps detekt's default.
#
# Rules with "requires type resolution" only run in the variant tasks (`detektDebug`,
# `detektDebugUnitTest`), not in the plain `detekt` task — CI runs the variant tasks.

config:
  validation: true

build:
  # Any finding outside the baseline fails the build.
  maxIssues: 0

coroutines:
  SuspendFunSwallowedCancellation:
    # A catch in a suspend call chain that eats CancellationException leaves a cancelled
    # coroutine running — the failure mode `catch (e: Exception)` hides.
    active: true

complexity:
  TooManyFunctions:
    # Count the public surface only. Private helpers are how LongMethod and
    # CyclomaticComplexMethod findings get fixed; counting them too would make those
    # rules and this one push in opposite directions. Overrides are dictated by the
    # supertype (Service, SensorEventListener, ...).
    ignorePrivate: true
    ignoreOverridden: true

exceptions:
  TooGenericExceptionCaught:
    active: true
  SwallowedException:
    active: true
  RethrowCaughtException:
    active: true

potential-bugs:
  UnsafeCallOnNullableType:
    active: true
  IgnoredReturnValue:
    # Default scope: calls annotated @CheckResult/@CheckReturnValue, and ignored
    # Sequence/Flow/Stream results. `restrictToConfig: false` would also cover OkHttp's
    # unannotated WebSocket.send, but on this codebase it reports 283 sites dominated by
    # Log.d, launch, let and MutableList.add — noise that would bury the real findings.
    active: true

naming:
  FunctionNaming:
    # Compose convention: @Composable functions are PascalCase.
    ignoreAnnotated: ['Composable']
  # frame-conventions.md §3 is normative and names rotations by frame: `R_W_D` maps device
  # into world, `R_D_V_step1` is a variant of it, `gyro_D` is a vector in frame D, and a
  # generic matrix operand is a single capital (`R`, `A`, `B`). Beyond detekt's default
  # camelCase, accept exactly those shapes — renaming them to camelCase would erase the
  # subscripts the document's cancellation rule is checked with.
  VariableNaming:
    variablePattern: '[a-z][A-Za-z0-9]*|[A-Z][a-z]?(_[A-Z]_[A-Z])?(_[A-Za-z0-9]+)*|[a-z][A-Za-z0-9]*_[A-Z]'
  FunctionParameterNaming:
    parameterPattern: '[a-z][A-Za-z0-9]*|[A-Z][a-z]?(_[A-Z]_[A-Z])?(_[A-Za-z0-9]+)*|[a-z][A-Za-z0-9]*_[A-Z]'

style:
  MagicNumber:
    # A literal assigned to a property is already named by the property (detekt's
    # recommended setting for Compose, where `val SignalKBlue = Color(0xFF1976D2)` is the
    # idiom).
    ignorePropertyDeclaration: true

formatting:
  # ktlint's rules, via detekt-formatting. Android Studio code style, matching the IDE's
  # formatter.
  android: true
  FunctionName:
    ignoreAnnotated: ['Composable']
