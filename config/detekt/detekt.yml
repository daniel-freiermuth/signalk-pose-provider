# Overrides on top of detekt's default config (`buildUponDefaultConfig = true` in
# app/build.gradle.kts). Everything not listed here keeps detekt's default.
#
# Rules with "requires type resolution" only run in the variant tasks (`detektDebug`,
# `detektDebugUnitTest`), not in the plain `detekt` task — CI runs the variant tasks.

config:
  validation: true

build:
  # Any finding fails the build; there is no baseline.
  maxIssues: 0

coroutines:
  SuspendFunSwallowedCancellation:
    # A catch in a suspend call chain that eats CancellationException leaves a cancelled
    # coroutine running — the failure mode `catch (e: Exception)` hides.
    active: true

complexity:
  TooManyFunctions:
    # Count the public surface only. Private helpers are how LongMethod and
    # CyclomaticComplexMethod findings get fixed; counting them too would make those
    # rules and this one push in opposite directions. Overrides are dictated by the
    # supertype (Service, SensorEventListener, ...).
    ignorePrivate: true
    ignoreOverridden: true

exceptions:
  TooGenericExceptionCaught:
    active: true
  SwallowedException:
    active: true
  RethrowCaughtException:
    active: true

potential-bugs:
  UnsafeCallOnNullableType:
    active: true
  IgnoredReturnValue:
    # Every call, not only @CheckResult ones: an ignored Boolean/Result is how a dropped
    # WebSocket.send or a failed registerListener goes unnoticed. The exceptions below
    # return something informational by contract: bytes logged, a map's previous value, a
    # Job owned by its scope, a fluent builder's receiver, a block's own value, or "was
    # already closing/stopped/popped" where the call site has nothing to do about it.
    # Own functions whose result is also published in state carry @CanIgnoreReturnValue.
    active: true
    restrictToConfig: false
    ignoreFunctionCall:
      - 'android.util.Log.v'
      - 'android.util.Log.d'
      - 'android.util.Log.i'
      - 'android.util.Log.w'
      - 'android.util.Log.e'
      - 'kotlinx.coroutines.launch'
      - 'kotlinx.coroutines.flow.StateFlow.collect'
      - 'kotlinx.coroutines.flow.SharedFlow.collect'
      - 'kotlin.let'
      - 'kotlin.apply'
      - 'kotlin.synchronized'
      - 'kotlin.checkNotNull'
      - 'kotlin.collections.MutableCollection.add'
      - 'kotlin.collections.MutableCollection.addAll'
      - 'kotlin.collections.MutableList.add'
      - 'kotlin.collections.MutableList.addAll'
      - 'android.content.Intent.putExtra'
      - 'android.content.SharedPreferences.Editor.putBoolean'
      - 'android.content.SharedPreferences.Editor.putFloat'
      - 'android.content.SharedPreferences.Editor.putLong'
      - 'android.content.SharedPreferences.Editor.putString'
      - 'kotlinx.serialization.json.put'
      - 'kotlinx.serialization.json.JsonObjectBuilder.put'
      - 'okhttp3.Request.Builder.addHeader'
      - 'okhttp3.WebSocket.close'
      - 'android.app.Service.stopSelfResult'
      # Calls on `this` resolve to the subclass's inherited copy.
      - 'com.signalk.companion.service.SignalKStreamingService.stopSelfResult'
      - 'android.os.HandlerThread.quitSafely'
      - 'android.view.View.post'
      - 'androidx.navigation.NavController.popBackStack'
      - 'androidx.navigation.NavHostController.popBackStack'
      - 'android.app.AlertDialog.Builder.show'
      - 'org.mockito.stubbing.OngoingStubbing.thenReturn'
      - 'org.mockito.stubbing.OngoingStubbing.thenThrow'
      - 'org.mockito.stubbing.OngoingStubbing.thenAnswer'
      - 'org.junit.jupiter.api.assertThrows'

naming:
  FunctionNaming:
    # Compose convention: @Composable functions are PascalCase.
    ignoreAnnotated: ['Composable']
  # frame-conventions.md §3 is normative and names rotations by frame: `R_W_D` maps device
  # into world, `R_D_V_step1` is a variant of it, `gyro_D` is a vector in frame D, and a
  # generic matrix operand is a single capital (`R`, `A`, `B`). Beyond detekt's default
  # camelCase, accept exactly those shapes — renaming them to camelCase would erase the
  # subscripts the document's cancellation rule is checked with.
  VariableNaming:
    variablePattern: '[a-z][A-Za-z0-9]*|[A-Z][a-z]?(_[A-Z]_[A-Z])?(_[A-Za-z0-9]+)*|[a-z][A-Za-z0-9]*_[A-Z]'
  FunctionParameterNaming:
    parameterPattern: '[a-z][A-Za-z0-9]*|[A-Z][a-z]?(_[A-Z]_[A-Z])?(_[A-Za-z0-9]+)*|[a-z][A-Za-z0-9]*_[A-Z]'

style:
  MagicNumber:
    # A literal assigned to a property is already named by the property (detekt's
    # recommended setting for Compose, where `val SignalKBlue = Color(0xFF1976D2)` is the
    # idiom).
    ignorePropertyDeclaration: true

formatting:
  # ktlint's rules, via detekt-formatting. Android Studio code style, matching the IDE's
  # formatter.
  android: true
  FunctionName:
    ignoreAnnotated: ['Composable']
