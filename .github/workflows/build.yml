name: build

# Compiles and unit-tests the app against a real Android SDK.
#
# This exists because the Android-dependent sources cannot be built everywhere they are
# edited: an environment without the SDK can parse Kotlin and run the pure-JVM tests, but it
# cannot tell you whether `LocationManager.allProviders` is spelled correctly or whether the
# Compose changes type-check. That gap is what this workflow closes — for every push, on
# hardware that has the SDK.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded run tells you nothing useful; cancel it and keep the queue short.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # No later step needs authenticated Git operations. Without this, the job token
          # is left in the checkout's Git config, readable by any build-logic code that
          # runs afterward (Gradle plugins included) — CodeRabbit/zizmor's "artipacked".
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          # Pinned to the toolchain the build declares (sourceCompatibility 17,
          # jvmTarget 17) rather than tracking the runner default, so a runner image
          # upgrade cannot silently change what the app is compiled against.
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@da187c8e6ffbd3802e00f2477aa5a822b25f2dda # v4.4.4
        with:
          # Only write to the shared cache from the default branch. PR branches read it but
          # cannot poison it for everyone else.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Install Android SDK Platform 36
        # compileSdk = 36 in app/build.gradle.kts. ubuntu-latest currently preinstalls
        # platform 35, but nothing in this workflow declares the dependency — a future runner
        # image is free to drop it and both Gradle steps below would fail without warning.
        #
        # `sdkmanager` is not on PATH on the runner image — only the cmdline-tools copy
        # under $ANDROID_HOME is guaranteed to exist, which is what broke the first version
        # of this step ("sdkmanager: command not found"). A block scalar here, not a quoted
        # inline string: a YAML scalar can't start with `"` and then continue past the
        # closing quote, which is exactly what broke the *second* version of this step —
        # not a shell error this time but a workflow-file parse failure, so the whole
        # workflow stopped running rather than just this step failing.
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36"

      - name: Report the toolchain
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || echo "no platforms directory"
          java -version

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        # Runs only on a successful assemble — an APK from a failed or cancelled build isn't
        # one worth installing, and building it here rather than locally is the whole point:
        # anyone on the PR can pull the artifact and put it on a phone without an SDK.
        if: ${{ success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload test report
        # Runs even when the tests fail — which is exactly when the report is worth having.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 14
          if-no-files-found: warn
