name: build

# Compiles and unit-tests the app against a real Android SDK.
#
# This exists because the Android-dependent sources cannot be built everywhere they are
# edited: an environment without the SDK can parse Kotlin and run the pure-JVM tests, but it
# cannot tell you whether `LocationManager.allProviders` is spelled correctly or whether the
# Compose changes type-check. That gap is what this workflow closes — for every push, on
# hardware that has the SDK.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded run tells you nothing useful; cancel it and keep the queue short.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# One job per check, so each shows up as its own status on the PR and a failure in one
# does not hide the verdict of the others. The jobs run in parallel; the toolchain setup
# they share lives in .github/actions/setup-android-build.
jobs:
  detekt:
    name: detekt (formatting + static analysis)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # No later step needs authenticated Git operations. Without this, the job token
          # is left in the checkout's Git config, readable by any build-logic code that
          # runs afterward (Gradle plugins included) — CodeRabbit/zizmor's "artipacked".
          persist-credentials: false

      - uses: ./.github/actions/setup-android-build

      - name: detekt
        # ktlint's formatting rules (via detekt-formatting) and detekt's correctness rules,
        # at error level: any finding fails the job. The variant tasks, not plain `detekt`:
        # only they run type-resolution rules such as IgnoredReturnValue and
        # SuspendFunSwallowedCancellation.
        run: ./gradlew detektDebug detektDebugUnitTest --continue --stacktrace

      - name: Upload detekt reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: detekt-reports
          path: app/build/reports/detekt/
          retention-days: 14
          if-no-files-found: warn

  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # No later step needs authenticated Git operations. Without this, the job token
          # is left in the checkout's Git config, readable by any build-logic code that
          # runs afterward (Gradle plugins included) — CodeRabbit/zizmor's "artipacked".
          persist-credentials: false

      - uses: ./.github/actions/setup-android-build

      - name: Android Lint
        # Warnings are errors (`lint {}` in app/build.gradle.kts): any finding fails the job.
        run: ./gradlew lintDebug --stacktrace

      - name: Upload lint report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          retention-days: 14
          if-no-files-found: warn

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # No later step needs authenticated Git operations. Without this, the job token
          # is left in the checkout's Git config, readable by any build-logic code that
          # runs afterward (Gradle plugins included) — CodeRabbit/zizmor's "artipacked".
          persist-credentials: false

      - uses: ./.github/actions/setup-android-build

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload test report
        # Runs even when the tests fail — which is exactly when the report is worth having.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 14
          if-no-files-found: warn

  assemble:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # No later step needs authenticated Git operations. Without this, the job token
          # is left in the checkout's Git config, readable by any build-logic code that
          # runs afterward (Gradle plugins included) — CodeRabbit/zizmor's "artipacked".
          persist-credentials: false

      - uses: ./.github/actions/setup-android-build

      - name: Assemble debug APK
        # Kotlin compiles with allWarningsAsErrors, so a compiler warning fails here.
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        # Runs only on a successful assemble — an APK from a failed or cancelled build isn't
        # one worth installing, and building it here rather than locally is the whole point:
        # anyone on the PR can pull the artifact and put it on a phone without an SDK.
        if: ${{ success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

  build:
    # Aggregate verdict under the check name this workflow reported before the split
    # ("build"), so a branch-protection rule that requires it keeps working.
    if: ${{ always() }}
    needs: [detekt, lint, unit-tests, assemble]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every job to have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
