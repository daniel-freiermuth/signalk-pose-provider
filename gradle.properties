# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true

# AGP 9 defaults both to true. Built-in Kotlin replaces the org.jetbrains.kotlin.android
# plugin, and detekt 1.23.8 only registers its type-resolving variant tasks (detektDebug,
# detektDebugUnitTest — the CI gate) when that plugin is applied; the old plugin in turn
# needs the legacy DSL. Remove both once detekt supports built-in Kotlin. AGP 10 drops
# these opt-outs.
android.builtInKotlin=false
android.newDsl=false
