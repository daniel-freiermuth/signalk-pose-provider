# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.enableJetifier=true

# AGP 9 opt-outs, both removed in AGP 10. detekt 1.23.8 only creates its type-resolving
# variant tasks (detektDebug, detektDebugUnitTest — the CI gate) for projects that apply
# org.jetbrains.kotlin.android, which built-in Kotlin replaces, and that plugin in turn
# needs the legacy DSL. The detekt release that supports built-in Kotlin is still 2.0.0
# alpha; drop both lines when moving to it.
android.builtInKotlin=false
android.newDsl=false
